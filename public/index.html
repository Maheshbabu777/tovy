<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Tovy</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      The page Tovy boots in (spec design-v2, slice 1). Before any JavaScript runs, it already shows the right
      background for the saved theme and, when someone is signed in on a wide screen, the empty sidebar the app is about
      to draw. So a reload goes from "frame" straight to "frame with tasks", with no white flash and nothing jumping.
      Keep the colours and sizes in step with src/ui/theme.tsx, src/ui/Shell.tsx (SIDEBAR) and src/ui/BootShell.tsx.
    -->
    <script>
      ;(function () {
        var d = document.documentElement
        var dark = false
        var signedIn = false
        var collapsed = false
        try {
          var raw = localStorage.getItem('tovy-theme')
          var pref = raw ? JSON.parse(raw).preference : 'system'
          dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i)
            if (k && k.indexOf('sb-') === 0 && k.slice(-11) === '-auth-token') signedIn = true
          }
          collapsed = localStorage.getItem('tovy-sidebar-collapsed') === '1'
        } catch (e) {}
        d.setAttribute('data-theme', dark ? 'dark' : 'light')
        if (signedIn) d.setAttribute('data-signed-in', '')
        if (collapsed) d.setAttribute('data-collapsed', '')
      })()
    </script>
    <style>
      :root {
        --boot-bg: #ffffff;
        --boot-panel: #f6f6f6;
        --boot-line: #e6e6e6;
      }
      [data-theme='dark'] {
        --boot-bg: #0a0a0a;
        --boot-panel: #141414;
        --boot-line: #262626;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--boot-bg);
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      #boot {
        flex: 1;
        display: flex;
      }
      #boot-sidebar {
        display: none;
        width: 260px;
        flex-shrink: 0;
        background: var(--boot-panel);
        border-right: 1px solid var(--boot-line);
      }
      [data-collapsed] #boot-sidebar {
        width: 68px;
      }
      @media (min-width: 768px) {
        [data-signed-in] #boot-sidebar {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <noscript>Tovy needs JavaScript to run.</noscript>
    <div id="root">
      <div id="boot"><div id="boot-sidebar"></div></div>
    </div>
  </body>
</html>
